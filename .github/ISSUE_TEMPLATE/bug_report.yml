name: Bug report
description: Report a reproducible Mandune defect using fictional data
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, cookies, real portfolios, account screenshots, or private logs. Report security issues according to SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and its user impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest sequence that reproduces the issue with fictional data.
      placeholder: |
        1. Start Mandune in fixture mode
        2. Create a random experience portfolio
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Onboarding and workspace
        - Portfolio input
        - Analysis and progress
        - Report and evidence
        - History and Atlas
        - A2A integration
        - Deployment and operations
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Use the APP_VERSION from /health or a commit SHA.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Node.js version, browser, analysis mode, and relevant non-secret configuration.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Add screenshots or logs only after removing private and credential-bearing content.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I used fictional or fully sanitized data.
          required: true
        - label: This report does not disclose a security vulnerability.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
