name: Feature request
description: Propose a user-facing improvement with a clear evidence and safety boundary
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who encounters this problem, and in what workflow?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior rather than an implementation choice.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Evidence, privacy, and financial boundary
      description: Explain what data is needed, what must remain private, and how the feature avoids precise trade instructions or promises.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and documentation.
          required: true
        - label: This request does not require sharing real credentials or portfolio data.
          required: true
