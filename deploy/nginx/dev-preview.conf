# 满懂前端实时预览：反代到本机 Vite dev server (127.0.0.1:5173)。
# /api 与 /health 由 Vite dev proxy 转发到 mandong.service (127.0.0.1:8787)。
# 仅用于开发预览；正式发布仍走 deploy/ 流程渲染 mandong.conf.template。
# 安装：ln -s 到 sites-enabled 后 nginx -t && systemctl reload nginx。
server {
    listen 80;
    listen [::]:80;
    server_name dev.wuxie233.com;
    access_log off;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.wuxie233.com;

    ssl_certificate /etc/letsencrypt/live/dev.wuxie233.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.wuxie233.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log off;
    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 210s;
        proxy_send_timeout 210s;
        proxy_buffering off;
    }
}
